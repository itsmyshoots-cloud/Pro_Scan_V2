name: apply-production-scan-v2
on:
  push:
    paths:
      - .github/workflows/apply-production-scan-v2.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore live monitoring AppDb
        run: |
          python - <<'PY'
          import base64,gzip
          raw=open('.patch/appdb-final.b64',encoding='utf-8').read().strip()
          open('src/AppDb.tsx','w',encoding='utf-8').write(gzip.decompress(base64.b64decode(raw)).decode())
          PY
          rm -rf .patch .github/workflows/apply-production-scan-v2.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppDb.tsx .patch .github/workflows/apply-production-scan-v2.yml
          git commit -m 'Add live monitoring and missing quantity'
          git push
