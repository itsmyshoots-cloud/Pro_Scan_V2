name: final-live-monitoring-patch
on:
  push:
    paths:
      - .github/workflows/final-live-monitoring-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AppDb
        run: |
          python - <<'PY'
          import re
          p='src/AppDb.tsx'
          s=open(p,encoding='utf-8').read()
          s=s.replace('useEffect(()=>{if(session)loadAll()},[session]);useEffect(()=>{if(session&&page==="Reports")loadReport()},[page,rb,rp,rm,rd,t1,t2]);','useEffect(()=>{if(session)loadAll()},[session]);useEffect(()=>{if(!session)return;let t=setInterval(()=>loadScans(),5000);return()=>clearInterval(t)},[session]);useEffect(()=>{if(session&&page==="Reports")loadReport()},[page,rb,rp,rm,rd,t1,t2]);')
          s=s.replace('pending=Math.max(0,(sd?.planned_quantity||0)-sa),vals=', 'pending=Math.max(0,(sd?.planned_quantity||0)-sa),shiftFinished=sd?new Date().toTimeString().slice(0,5)>=sd.shift_end.slice(0,5):false,missing=shiftFinished?pending:0,vals=')
          s=s.replace('pending={pending} date={now}', 'pending={pending} missing={missing} date={now}')
          s=s.replace('pending,date}:{p:Plan[];', 'pending,missing,date}:{p:Plan[];')
          s=s.replace('pending:number;date:Date})', 'pending:number;missing:number;date:Date})')
          s=s.replace('<div className="metric-danger"><span>MISSING</span><strong>0</strong></div>', '<div className="metric-danger"><span>MISSING</span><strong>{missing}</strong></div>')
          marker='</section></>}\n {page==="Monthly Plans"'
          board='</section><section className="panel" style={{marginTop:12}}><div className="panel-header"><div><h2>Planned vs actual live board</h2><p>Live production comparison across active daily plans.</p></div></div><div style={{padding:16,display:"grid",gap:12}}>{daily.map(d=>{const a=actual[d.id]||0,pct=d.planned_quantity?Math.min(100,Math.round(a/d.planned_quantity*100)):0;return <div key={d.id} style={{display:"grid",gridTemplateColumns:"220px 1fr 80px",gap:12,alignItems:"center"}}><div style={{fontSize:10,fontWeight:700}}>{one(d.production_lines)?.line_name} · {plans.find(p=>p.id===d.monthly_plan_id)?.model}</div><div style={{height:12,background:"#edf1f5",borderRadius:8,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:"#1676e8",borderRadius:8}}/></div><strong style={{fontSize:10}}>{a} / {d.planned_quantity}</strong></div>})}</div></section></>}\n {page==="Monthly Plans"'
          s=s.replace(marker,board,1)
          checks=[('clock refresh','setInterval(()=>loadScans(),5000)' in s),('missing metric','{missing}</strong>' in s),('missing prop','pending:number;missing:number;date:Date' in s),('live board','Planned vs actual live board' in s)]
          bad=[x for x,ok in checks if not ok]
          if bad: raise SystemExit('Patch failed: '+','.join(bad))
          open(p,'w',encoding='utf-8').write(s)
          PY
          rm .github/workflows/final-live-monitoring-patch.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppDb.tsx .github/workflows/final-live-monitoring-patch.yml
          git commit -m 'Add live monitoring board and missing quantity'
          git push
