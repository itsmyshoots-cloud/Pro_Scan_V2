name: UI upgrade
on:
  push:
    paths:
      - '.github/workflows/ui_upgrade.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable AppDb and apply final production upgrade
        run: |
          git show 5d8a29a94661247f030509e809aed56628bffb16:src/AppDb.tsx > src/AppDb.tsx
          python .github/final_patch.py
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppDb.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Finalize production control UI and planning"
          git push
