name: UI upgrade
on:
  push:
    paths:
      - '.github/workflows/ui_upgrade.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable AppDb and apply final production upgrade
        run: |
          curl -L --fail https://raw.githubusercontent.com/itsmyshoots-cloud/Pro_Scan_V2/36ff6c2f3c31b0fb388895e355e594b6c2066cb4/src/AppDb.tsx -o src/AppDb.tsx
          python - <<'PY'
          from pathlib import Path
          p=Path('src/AppDb.tsx'); s=p.read_text()
          s=s.replace('type Daily={id:string;monthly_plan_id:string;production_date:string;line_id:string;shift_id:string;shift_start:string;shift_end:string;planned_quantity:number;target_per_hour:number;planned_hours:number;max_capacity_quantity:number;status:string;production_lines?:Line|Line[];production_shifts?:Shift|Shift[]};','type Daily={id:string;monthly_plan_id:string;production_date:string;line_id:string;shift_id:string;shift_start:string;shift_end:string;break_minutes:number;planned_quantity:number;target_per_hour:number;planned_hours:number;max_capacity_quantity:number;status:string;submitted_to_scan:boolean;locked_at:string|null;production_lines?:Line|Line[];production_shifts?:Shift|Shift[]};')
          p.write_text(s)
          PY
          python .github/final_patch.py
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppDb.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Finalize production control UI and planning"
          git push
