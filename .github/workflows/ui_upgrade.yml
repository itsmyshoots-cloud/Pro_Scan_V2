name: UI upgrade
on:
  push:
    paths:
      - '.github/workflows/ui_upgrade.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final compatibility fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/AppDb.tsx')
          s=p.read_text()
          s=s.replace('type Page="Overview"|"Monthly Plans"|"Daily Plans"|"Scan Events"|"Reports";', 'type Page="Overview"|"Monthly Plans"|"Daily Plans"|"Scan Events"|"Reports"|"Settings";')
          p.write_text(s)
          PY
      - name: Verify application build
        run: |
          npm install
          npm run build
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppDb.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix production control type compatibility"
          git push
