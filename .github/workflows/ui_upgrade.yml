name: UI upgrade
on:
  push:
    paths:
      - '.github/workflows/ui_upgrade.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore last good AppDb and apply stable upgrade
        run: |
          git show 967f7543d224f43bb3ad604dc908e10bda72340a:src/AppDb.tsx > src/AppDb.tsx
          python .github/old_appdb_upgrade.py
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppDb.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize production control UI upgrade"
          git push
